# 可复用工作流：把各项目的 ci / package / publish 中逐字重复的构建发布流程收敛到一处
#
# 前因：每个项目原先都各自抄一遍 checkout / setup-go / setup-task / 取版本 / 取构建时间 /
# verify / build-all / changelog / 建 Release / 上传产物，四个文件里同一段逻辑出现三遍，
# 修一次要改三个仓库。此处把公共部分抽出，调用方只保留各自的「触发条件」与「权限」，
# 差异通过下面的 inputs 表达
#
# 该文件只声明 workflow_call，不会被 push / PR 等事件直接触发
#
# 调用方契约（本工作流依赖调用方提供这三个 Taskfile 任务，不直接调用任何构建命令）：
#   task verify      —— 完整校验，失败即中止，不产出任何二进制
#   task build-all   —— 全平台构建，产物落在 build/（本工作流按 build/* 上传与发布）
#   task changelog   —— 生成发布说明到 stdout，接 VERSION、TYPE(dev/release) 与可选的 NOTES_LANG
#                       NOTES_LANG 为空串时必须**不传**语言参数，让项目自己的默认语言生效
#                       （刻意不叫 LANG：那是系统区域变量，撞名会连带影响该步骤里其它命令的 locale）
# 这样约定而不直接写死 eggokit 的命令行，是为了让本工作流与具体构建方式解耦：
# 调用方换构建工具、换语言都不必改这里，只需让那三个任务存在
#
# 引用方式：调用方用 `uses: Jy-EggRoll/eggokit/.github/workflows/go-release.yml@main`
name: Go Release

on:
    workflow_call:
        inputs:
            # 投递方式，决定「校验之后做什么」，四种取值与三个调用方的路径一一对应
            # verify-only：只跑校验，不构建、不上传        —— 对应 ci 的 PR 路径
            # artifact   ：校验 + 全平台构建 + 上传产物      —— 对应 ci 的 push 路径、package 的手动运行
            # prerelease ：校验 + 构建 + dev 更新日志 + 开发预发布 —— 对应 package 的 tag 路径
            # release    ：校验 + 构建 + 更新日志 + 正式发布   —— 对应 publish
            # release_tag 非空时，prerelease 换成滚动预发布：同一个标签反复覆盖同一个 Release；
            # 为空时仍是原来的「一次一个开发版」行为，既有调用方完全不受影响
            mode:
                description: '投递方式：verify-only / artifact / prerelease / release'
                required: true
                type: string

            # 程序名，用于拼装 Release 标题（"<app> v<版本>"）。必须与 release.json 里的 app 一致
            app:
                description: '程序名，用于 Release 标题（如 flk、ggt）'
                required: true
                type: string

            # 版本号来源，决定二进制内嵌版本号与产物名所用的版本串
            # tag           ：取触发本次运行的标签名            —— package 的 tag 路径、publish
            # timestamp     ：形如 2026-10-01-12-00-00          —— ci 的 push 路径
            # dev-timestamp ：形如 dev-20261001-120000          —— package 的手动运行
            # commit        ：短提交号，如 3f9c1ab              —— 主分支滚动预发布，配 release_tag
            # 前三种格式刻意保留差异：这是各项目改造前既有的取版本逻辑，统一会改变产物名与内嵌版本号
            # commit 是新增的一种，用途与前三种不同：滚动预发布的版本号必须等于提交号，升级器才能
            # 拿已装版本与最新一次构建比对，判断要不要升级。时间戳做不到这一点——同一个提交重新构建
            # 会得到新的版本号，升级器会一直认为有新版本，每次推送都白白触发一次升级
            version_source:
                description: '版本号来源：tag / timestamp / dev-timestamp / commit'
                required: false
                type: string
                default: 'tag'

            # 滚动预发布的固定标签，留空表示不启用，行为与此前完全一致
            # 非空时每次推送都用这个标签更新同一个 Release，同名资产覆盖，只保留最新一份
            # 只与 mode=prerelease 组合：它表达的是「反复覆盖同一个预发布」，而正式发布每次都必须
            # 换新标签，两者语义相反，因此组合非法，由下面的 Validate release_tag 步骤明确失败；
            # verify-only / artifact 不发布 Release，这个输入在那里同样不生效，一并判为非法，
            # 免得调用方配了却始终没有产物，而 CI 一路绿色
            # 必须配 version_source=commit，产物名与内嵌版本号才会是提交号，由下面的校验步骤强制
            release_tag:
                description: '滚动预发布的固定标签（如 alpha）；留空表示不启用'
                required: false
                type: string
                default: ''

            # 产物名称前缀，最终产物名 = 前缀 + 版本号
            # 各项目既有差异（如 flk- 与 binaries-）必须原样保留，否则历史产物名会变
            artifact_prefix:
                description: '上传产物的名称前缀（产物名 = 前缀 + 版本号）'
                required: false
                type: string
                default: 'binaries-'

            # 产物保留天数：分支构建通常只留几天，发布产物留得更久，由调用方各自传入
            retention_days:
                description: '产物保留天数'
                required: false
                type: number
                default: 3

            # 发布说明的语言，留空表示用项目自己的默认（release.json 的 releaseNotesLang，
            # 再退到内置默认 en）。留空是常态；需要某一次发布临时用另一种语言时（例如对外
            # 正式发版想用英文、日常预发布用中文），在调用方工作流里传这一个值即可
            changelog_lang:
                description: '发布说明语言（如 en / zh-CN）；留空用项目默认'
                required: false
                type: string
                default: ''

jobs:
    build:
        # 刻意不在此声明 permissions：可复用工作流拿到的令牌权限始终以调用方为上限，
        # 调用方已各自保留原样（校验类只读、发布类写），因此这里实际权限与各项目原先完全一致
        runs-on: ubuntu-latest
        steps:
            # release_tag 一旦非空，就是声明「这次走滚动预发布」，此时有两项配置必须成立：
            # mode 必须是 prerelease（release 每次换新标签，verify-only / artifact 根本不发
            # Release）；version_source 必须是 commit（版本号不是提交号时，升级器拿本地版本与
            # 标记里的提交号没法比较，会每次检查都提示有更新，等于功能失效）。逐条检查、分别
            # 说清缺哪一条，并显式失败而不是静默忽略——配错时若一路绿色，问题会拖到很久以后
            - name: Validate release_tag
              if: inputs.release_tag != '' && (inputs.mode != 'prerelease' || inputs.version_source != 'commit')
              env:
                  RELEASE_TAG: ${{ inputs.release_tag }}
                  MODE: ${{ inputs.mode }}
                  VERSION_SOURCE: ${{ inputs.version_source }}
              run: |
                  if [ "$MODE" != "prerelease" ]; then
                    echo "release_tag=${RELEASE_TAG} 需要 mode=prerelease，当前 mode=${MODE}；正式发布请留空 release_tag" >&2
                  fi
                  if [ "$VERSION_SOURCE" != "commit" ]; then
                    echo "release_tag=${RELEASE_TAG} 需要 version_source=commit，当前 version_source=${VERSION_SOURCE}；否则版本号不是提交号，升级器无法判断是否已是最新" >&2
                  fi
                  exit 1

            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  # 取全量历史与所有标签：changelog 依赖 git tag 列表，浅克隆看不到历史标签
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  # 始终以调用方的 go.mod 为 Go 版本的唯一来源，避免工作流与项目配置漂移
                  go-version-file: go.mod
                  cache: true

            - name: Setup Task
              uses: go-task/setup-task@v2
              with:
                  # setup-task 的版本号在此收敛为唯一一处，杜绝各文件各写一遍而漂移
                  version: 3.x

            # 取版本号：前三种来源逐字复刻各项目改造前的逻辑，commit 是新增的一种
            # 用 env 传入而非直接内插到脚本里，避免输入被当作 shell 代码执行
            - name: Get version
              if: inputs.mode != 'verify-only'
              id: get_version
              env:
                  VERSION_SOURCE: ${{ inputs.version_source }}
              run: |
                  case "$VERSION_SOURCE" in
                    tag)
                      VERSION=${GITHUB_REF#refs/tags/}
                      ;;
                    timestamp)
                      VERSION=$(date '+%Y-%m-%d-%H-%M-%S')
                      ;;
                    dev-timestamp)
                      VERSION="dev-$(date +%Y%m%d-%H%M%S)"
                      ;;
                    # 短提交号：滚动预发布的二进制版本号就是它，升级器据此判断是否已是最新
                    commit)
                      VERSION=$(git rev-parse --short HEAD)
                      ;;
                    *)
                      echo "未知的 version_source：$VERSION_SOURCE" >&2
                      exit 1
                      ;;
                  esac
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            # 构建时间只被 build-all 消费，verify-only 模式下没有消费者，因而同样跳过
            - name: Get build time
              if: inputs.mode != 'verify-only'
              id: get_build_time
              run: |
                  BUILDTIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  echo "buildtime=$BUILDTIME" >> "$GITHUB_OUTPUT"

            # 先验证再构建：验证失败时不会产出任何可执行文件，避免把有问题的二进制交到手上
            - name: Verify source
              run: task verify

            - name: Build binaries for all platforms
              if: inputs.mode != 'verify-only'
              run: task build-all
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
                  BUILDTIME: ${{ steps.get_build_time.outputs.buildtime }}

            # dev 版更新日志：TYPE=dev 会加入开发版警告与版本信息，并把 tag 匹配放宽到任意标签
            # 版本号经 env 传入而非内插进脚本文本：tag 名是外部输入，直接拼进命令行等于把它
            # 当作 shell 代码执行（标签名允许的字符集里含分号等元字符），跨仓库复用的工作流尤须防这一层
            - name: Generate release notes (dev)
              if: inputs.mode == 'prerelease' && inputs.release_tag == ''
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
                  CHANGELOG_LANG: ${{ inputs.changelog_lang }}
              run: task changelog VERSION="$VERSION" TYPE=dev NOTES_LANG="$CHANGELOG_LANG" > release_notes.md

            # 滚动预发布没有 semver 标签，changelog 那套按标签匹配的逻辑用不上，说明改为固定文案
            # 首行是升级器解析的机器可读标记：字段顺序、单个空格、完整提交号的四十位长度与时间格式
            # 都是解析契约的一部分，alpha-build 这个词也不能跟着 release_tag 改名，否则升级器认不出
            # 这份产物。要动它必须先改升级器，不能只改这里
            # 构建时间复用 Get build time 的输出，不在这里重新取一次：二进制里内嵌的构建时间与说明里
            # 写的时间必须是同一个值，否则看到的人会以为哪里对不上
            # 本步骤与上面的 dev 说明互斥（if 条件互补），两者都写 release_notes.md 也不会互相覆盖
            - name: Write rolling release notes
              if: inputs.mode == 'prerelease' && inputs.release_tag != ''
              id: rolling_release
              env:
                  APP: ${{ inputs.app }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
                  BUILDTIME: ${{ steps.get_build_time.outputs.buildtime }}
              run: |
                  SHORT_COMMIT=$(git rev-parse --short HEAD)
                  FULL_COMMIT=$(git rev-parse HEAD)
                  {
                    echo "<!-- alpha-build: ${FULL_COMMIT} ${BUILDTIME} -->"
                    echo
                    echo "# ${APP} ${RELEASE_TAG}"
                    echo
                    echo "这是滚动预发布：每次主分支推送都会用同一个标签（${RELEASE_TAG}）更新这一份 Release，"
                    echo "同名资产直接覆盖，因此这里始终对应最新一次构建。"
                    echo
                    echo "- 对应提交：${FULL_COMMIT}"
                    echo "- 构建时间：${BUILDTIME}"
                    echo
                    echo "可以直接从任意旧版本升级到这一份，不必逐版本推进。"
                  } > release_notes.md
                  echo "short_commit=${SHORT_COMMIT}" >> "$GITHUB_OUTPUT"

            # 正式版更新日志：TYPE 走 Taskfile 默认值 release，只匹配 semver 标签并附带 CHANGELOG 摘要
            - name: Generate release notes
              if: inputs.mode == 'release'
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
                  CHANGELOG_LANG: ${{ inputs.changelog_lang }}
              run: task changelog VERSION="$VERSION" NOTES_LANG="$CHANGELOG_LANG" > release_notes.md

            - name: Create development release
              if: inputs.mode == 'prerelease' && inputs.release_tag == ''
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.get_version.outputs.version }}
                  name: "${{ inputs.app }} v${{ steps.get_version.outputs.version }} (开发版)"
                  body_path: release_notes.md
                  files: |
                      build/*
                  draft: false
                  prerelease: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # 滚动预发布：标签固定，每次覆盖同名资产，不会像开发版那样每推一次就多出一个 Release
            # overwrite_files 与 make_latest 的默认值恰好就是这里要的值，仍然显式写出，让「只保留最新
            # 一份」的意图在文件里看得见，日后 action 改默认值也不会悄悄改变语义。预发布本身不会被设为
            # latest（预发布与草稿都不能当 latest），写 false 是把这个事实讲在文件里
            # 标题里的提交号取自上一步的 git rev-parse HEAD，与 version_source 无关，因此不依赖版本号；
            # version_source 配错的组合已被前面的校验步骤拦下，这里不必再兜一层判断
            - name: Update rolling prerelease
              if: inputs.mode == 'prerelease' && inputs.release_tag != ''
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.release_tag }}
                  name: "${{ inputs.app }} ${{ inputs.release_tag }} (${{ steps.rolling_release.outputs.short_commit }})"
                  body_path: release_notes.md
                  files: |
                      build/*
                  draft: false
                  prerelease: true
                  overwrite_files: 'true'
                  make_latest: 'false'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Create GitHub Release
              if: inputs.mode == 'release'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.get_version.outputs.version }}
                  name: "${{ inputs.app }} v${{ steps.get_version.outputs.version }}"
                  body_path: release_notes.md
                  files: |
                      build/*
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload build artifacts
              if: inputs.mode != 'verify-only'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.artifact_prefix }}${{ steps.get_version.outputs.version }}
                  path: build/*
                  retention-days: ${{ inputs.retention_days }}
